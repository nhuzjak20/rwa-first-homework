# Render Blueprint: web service + managed PostgreSQL.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: digital-passes
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    # Migrations are idempotent and run on every start (free plan has no pre-deploy command).
    startCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: digital-passes-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: AUTH0_ISSUER_BASE_URL
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_WEB_CLIENT_ID
        sync: false
      - key: AUTH0_WEB_CLIENT_SECRET
        sync: false

databases:
  - name: digital-passes-db
    plan: free
    region: frankfurt
    databaseName: digital_passes
